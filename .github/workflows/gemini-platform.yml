name: KNOuX Gemini Standalone
on: [push, pull_request]
jobs:
  native-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gemini-ui/package-lock.json
      - run: npm ci --prefix apps/gemini-ui
      - run: npm run lint
      - run: npm run build
      # Theme contract before the expensive suites: one canonical token layer,
      # night/day role parity, WCAG AA floors and a generated navy bridge that
      # still matches the source it was built from.
      - run: npm run test:theme
      # Bilingual slot guard: a swapped (english, arabic) argument is invisible to
      # tsc and to a single-language screenshot, so it is checked statically.
      - run: npm run test:i18n
      # The mission ledger is the acceptance record, so a record that claims
      # "accepted" without runtime evidence, a commit SHA, a remote SHA and a CI
      # result fails the build instead of passing quietly.
      - run: npm run ledger:check
      - run: npm run test:native
      - run: npm run test:clipboard
      - run: npm run test:studio
      - run: npm run test:studio-safety
      - run: npm run test:files
      - run: npm run test:storage
      - run: npm run test:scan
      - run: npm run test:apps
      - run: npm run test:cleanup
      - run: npm run test:startup
      - run: npm run test:system
      - run: npm run test:repair
      - run: npm run test:services
      - run: npm run test:automation
      - run: npm run test:workspace
      - run: npm run test:google
      - run: npm run test:settings
      - run: npm run test:home
      - run: npm run test:workbench
      - run: npm run test:navigation
